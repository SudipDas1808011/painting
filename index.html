<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Drawing App</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #000;
            background-color: #fff;
            cursor: default;
        }
        .controls {
            margin-bottom: 10px;
        }
        button {
            margin: 0 5px;
            padding: 10px;
            font-size: 16px;
        }
        #penBlack:active{
            background-color: black;
            color: white;
        }
        #penRed:active{
            background-color: rgb(255, 0, 0);
            color: white;
        }
        #penBlue:active{
            background-color:blue;
            color: white;
        }
     
    </style>
</head>
<body>

    <div class="controls">
        <button class="colorbtn" id="penBlack">Black Pen</button>
        <button class="colorbtn"  id="penBlue">Blue Pen</button>
        <button class="colorbtn"  id="penRed">Red Pen</button>
        <button class="colorbtn"  id="eraser">Eraser</button>
        <button class="colorbtn"  id="save">Save</button> <!-- Save button added -->
    </div>
    <canvas id="drawingCanvas"></canvas>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let color = 'black';
        let erasing = false;
	

        // Function to resize the canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth * 0.95; // 90% of the window width
            canvas.height = window.innerHeight * 0.9; // 70% of the window height
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas
        }

        // Set up event listeners for mouse events
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (drawing) {
                if (erasing) {
                    ctx.clearRect(e.offsetX, e.offsetY, 30, 30);
                } else {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.lineTo(e.offsetX, e.offsetY);
                    ctx.stroke();
                }
            }
        });

        canvas.addEventListener('mouseup', () => {
            drawing = false;
            ctx.closePath();
        });

        canvas.addEventListener('mouseout', () => {
            drawing = false;
            ctx.closePath();
        });

        // Button event listeners
        document.getElementById('penBlack').addEventListener('click', () => {
            color = 'black';
            erasing = false;
            canvas.style.cursor = "default"
            
        });
        document.getElementById('penBlue').addEventListener('click', () => {
            color = 'blue';
            erasing = false;
            canvas.style.cursor = "default"
            
        });

        document.getElementById('penRed').addEventListener('click', () => {
            color = 'red';
            erasing = false;
            canvas.style.cursor = "default"
            
        });

        document.getElementById('eraser').addEventListener('click', () => {
            erasing = true;
            canvas.style.cursor = "wait"
           
        });

        document.getElementById('save').addEventListener('click', () => {
    // Create a temporary canvas to draw the current canvas with a white background
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');

    // Set the dimensions of the temporary canvas
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;

    // Fill the temporary canvas with a white background
    tempCtx.fillStyle = 'white';
    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

    // Draw the current canvas onto the temporary canvas
    tempCtx.drawImage(canvas, 0, 0);

    // Create a link to download the image
    const link = document.createElement('a');
    link.download = 'drawing.jpg'; // Name of the downloaded file
    link.href = tempCanvas.toDataURL('image/jpeg'); // Convert temporary canvas to JPEG
    link.click(); // Trigger the download
});


        // Resize the canvas when the window is resized
        window.addEventListener('resize', resizeCanvas);

        // Initial canvas size
        resizeCanvas();
    </script>

</body>
</html>
